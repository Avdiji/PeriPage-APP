# Builds the Windows app and the Android APK for every pushed tag and publishes them as a GitHub release
# named after the tag. Tags like v1.2.3 / 1.2.3 also become the app's version name.
#
# Optional repository secrets for a stable Android signing key (without them the APK is debug-signed,
# and a debug-signed APK cannot be installed over a differently signed earlier one):
#   ANDROID_KEYSTORE_BASE64    base64 of the .jks keystore
#   ANDROID_KEYSTORE_PASSWORD  store password
#   ANDROID_KEY_ALIAS          key alias
#   ANDROID_KEY_PASSWORD       key password
name: Release

on:
  push:
    tags: ['*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analyze & test
    runs-on: ubuntu-latest
    outputs:
      flutter-version: ${{ steps.meta.outputs.flutter }}
      build-args: ${{ steps.meta.outputs.build_args }}
    steps:
      - uses: actions/checkout@v4

      - name: Read Flutter version and app version
        id: meta
        shell: bash
        run: |
          echo "flutter=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "build_args=--build-name=$version --build-number=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          else
            # Non-semver tags keep the pubspec version name.
            echo "build_args=--build-number=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.meta.outputs.flutter }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  windows:
    name: Windows build
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.verify.outputs.flutter-version }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build windows --release ${{ needs.verify.outputs.build-args }}

      # The .exe needs the DLLs and data folder next to it, so ship the whole Release folder.
      - name: Package
        shell: pwsh
        run: |
          $name = "PeriPage-${env:GITHUB_REF_NAME}-windows-x64.zip"
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath $name
          "ASSET=$name" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ${{ env.ASSET }}
          if-no-files-found: error

  android:
    name: Android build
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.verify.outputs.flutter-version }}
          channel: stable
          cache: true

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — the APK is debug-signed and can't update earlier installs."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=release-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - run: flutter pub get
      - run: flutter build apk --release ${{ needs.verify.outputs.build-args }}

      - name: Package
        shell: bash
        run: |
          name="PeriPage-${GITHUB_REF_NAME}.apk"
          mv build/app/outputs/flutter-apk/app-release.apk "$name"
          echo "ASSET=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
